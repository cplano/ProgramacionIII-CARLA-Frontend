<!-- <header> es la etiqueta semántica para el encabezado de la página -->
<header>
  <!-- Título principal del sitio (único h1 de la página) -->
  <h1>Sistema de Gestión</h1>

  <!-- Menú de navegación.
       routerLink (en vez de href): Angular cambia de ruta SIN recargar la página,
       solo reemplaza lo que se ve en <router-outlet>. -->
  <nav>
    <a routerLink="/">Inicio</a>
    <a routerLink="/login">Login</a>
    <a routerLink="/registro">Registro</a>
    <a routerLink="/pasatiempos">Pasatiempos</a>
  </nav>
</header>
