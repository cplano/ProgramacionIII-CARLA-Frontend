<!doctype html>
<!-- UNICA pagina HTML de la app (Angular es una SPA: Single Page Application).
     Angular no cambia de pagina: reemplaza el contenido de <app-root> con los componentes. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PrimerProyecto</title>
  <!-- base href: ruta base para los enlaces y el router de Angular -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!-- Aca se dibuja el componente raiz App (su selector es 'app-root') -->
  <app-root></app-root>
</body>
</html>
