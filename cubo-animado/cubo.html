<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cubo.css">
</head>

<body>

    <!-- El div "padre" es el cubo completo: es el que gira (animacion en el CSS).
         Cada div "hijo" es una de las 6 caras.
         Tienen DOS clases separadas por espacio: "hijo" (estilos comunes a todas
         las caras) y "caraN" (posicion y color propios de cada cara). -->
    <div class="padre">
        <div class="hijo cara1"></div>
        <div class="hijo cara2"></div>
        <div class="hijo cara3"></div>
        <div class="hijo cara4"></div>
        <div class="hijo cara5"></div>
        <div class="hijo cara6"></div>
    </div>

</body>

</html>
